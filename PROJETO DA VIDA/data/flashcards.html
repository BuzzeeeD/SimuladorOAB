<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashCards Estilo Tinder</title>
  <link rel="stylesheet" href="css/flashcards.css">
</head>
<body>
    <body>
        <div class="flashcards-container">
          <!-- Cabeçalho -->
          <header class="flashcards-header">
            <h1>FlashCards - Certo ou Errado</h1>
            <p>Usuário: João Silva | Pontuação: <span id="score">0</span></p>
          </header>

          <!-- Seção de progresso -->
          <section class="flashcards-progress">
            <p><strong>Matéria:</strong> Geografia</p>
            <p><strong>Questões Respondidas:</strong> <span id="answered">0</span></p>
            <p><strong>Acertos:</strong> <span id="correct">0</span></p>
            <p><strong>Erros:</strong> <span id="wrong">0</span></p>
            <div class="progress-bar">
                <div class="progress" style="width: 50%;"></div>
              </div>
          </section>
      
           <!-- Container de cards -->
    <div id="card-container" class="flashcards-card-container"></div>

    <!-- Seção de explicações -->
    <section id="explanation" class="flashcards-explanation hidden">
      <h2>Explicação:</h2>
      <p id="explanation-text"></p>
    </section>
      
          <!-- Barra de botões -->
          <div id="card-container" class="flashcards-card-container"></div>

          <div class="flashcards-buttons">
            <button id="btn-wrong" class="flashcards-btn btn-wrong">Errado</button>
            <button id="btn-correct" class="flashcards-btn btn-correct">Certo</button>
          </div>
  <script src="js/flashcards.js"></script>
</body>
</html>
