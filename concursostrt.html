<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Dados e Questões de Provas - TRT</title>
    <link rel="stylesheet" href="data/concursostrt.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  </head>
<body>
  <div class="header-container">
    <header>
      <div class="logo-themis">
        <img src="data/logos/logothemis.png" alt="Logo Têmis" class="logo-themis-img">
      </div>
      <div class="logo">
        <img src="data/logos/trt.png" alt="Logo" class="logo-img">
      </div>
    </header>
  </div>

  <main>
    <div class="exames-container">
      <div class="card">
          <i class="fas fa-filter card-icon"></i>
          <h3>Escolha a Prova</h3>
          <select id="filtroOrgao">
              <option value="">Selecione o Órgão</option>
          </select>
          <select id="filtroAno">
              <option value="">Selecione o Ano</option>
          </select>
          <select id="filtroCargo">
              <option value="">Selecione o Cargo</option>
          </select>
      </div>
      <div class="card">
          <i class="fas fa-book card-icon"></i>
          <h3>Questões por Matéria</h3>
          <select id="filtroDisciplina">
              <option value="">Selecione a Disciplina</option>
          </select>
          <select id="filtroOrgaoMateria">
              <option value="">Selecione o Órgão</option>
          </select>
          <select id="filtroAnoMateria">
              <option value="">Selecione o Ano</option>
          </select>
      </div>
    </div>

    <section id="layout-container">
      <h1>Provas e Questões do TRT.</h1>
      <div id="descriptionContainer"></div>
    </section>
  </main>

 

  <div id="chat-popup" class="chat-popup" style="display: none;">
    <input type="hidden" id="indexQuestaoAtual" value="1">
    <div class="chat-header">
      <h2>Tirar Dúvidas</h2>
      <button class="close-btn" onclick="fecharChatPopup()">X</button>
    </div>
    <div class="chat-body">
      <div id="chat-content" class="chat-content"></div>
    </div>
    <div class="chat-footer">
      <input type="text" id="chat-input" placeholder="Digite sua dúvida..." />
      <button id="chat-submit" onclick="enviarPergunta()">Enviar</button>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <p><strong>Prepare-se para Concursos Públicos</strong></p>
      <p>Simulador de Provas e Questões por Leonardo Frota</p>
      <p><strong>Contato:</strong> (21) 97665-1085 | <a href="mailto:l.frota94@gmail.com">l.frota94@gmail.com</a></p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="data/scriptconcursostrt.js"></script>
</body>
</html>
